name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test deps (no model weights, no network at test time)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet "pillow>=11,<13" "pillow-heif>=0.18,<2" "imagehash>=4.3,<5" \
            "requests>=2.32,<3" "numpy>=1.26,<3" "pyyaml>=6,<7" "pytest>=8,<9"
      - name: Engine tests (incl. egress guard)
        working-directory: scripts
        run: python -m pytest tests -q
