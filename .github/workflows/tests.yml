name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Privacy scanner regression tests
        run: python3 -m unittest -v tools/test_leak_scan.py
      - name: Mount private denylist outside the checkout
        env:
          PRIVATE_DENYLIST: ${{ secrets.CONSTELLATION_PRIVATE_DENYLIST }}
        run: |
          umask 077
          denylist="$RUNNER_TEMP/constellation-private-denylist"
          printf '%s\n' "$PRIVATE_DENYLIST" > "$denylist"
          printf 'CONSTELLATION_PRIVATE_DENYLIST=%s\n' "$denylist" >> "$GITHUB_ENV"
      - name: No private data in the public repository candidate
        run: python3 tools/leak_scan.py --require-private-denylist
      - name: No private data in the commits this push published
        if: github.event_name == 'push' && !github.event.deleted
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The tag OBJECT for tag pushes (its message is scanned too).
          PUSHED=$(git rev-parse "$GITHUB_REF")
          # No post-push tip, including the default branch, proves prior
          # publication: a simultaneous push can move every fetched branch.
          # Trust only the event's BEFORE value; new refs scan all history.
          BASE=""
          printf '%s %s %s %s\n' "$GITHUB_REF" "$PUSHED" "$GITHUB_REF" "${BEFORE:-0000000000000000000000000000000000000000}" \
            | python3 tools/leak_scan.py --require-private-denylist --pushed-ci "$BASE"
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test deps (no model weights, no network at test time)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet "pillow>=11,<13" "pillow-heif>=0.18,<2" "imagehash>=4.3,<5" \
            "requests>=2.32,<3" "numpy>=1.26,<3" "pyyaml>=6,<7" "pytest>=8,<9" \
            "cryptography>=43,<47" "onnxruntime>=1.18,<2"
      - name: Engine tests (incl. egress guard)
        working-directory: scripts
        run: python -m pytest tests -q
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
      - name: Install installer deps from the lockfile (skip Electron's binary download)
        working-directory: installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Installer unit tests (no Electron needed)
        working-directory: installer
        run: npm test
